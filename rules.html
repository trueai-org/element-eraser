<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>规则管理 - Element Eraser</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f9fa;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        border-radius: 12px;
        margin-bottom: 30px;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      h1 {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 16px;
        opacity: 0.9;
      }

      .toolbar {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 300px;
      }

      .search-box input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      .search-box input:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      .btn-danger {
        background: #f56565;
        color: white;
      }

      .btn-danger:hover {
        background: #e53e3e;
        box-shadow: 0 4px 12px rgba(245, 101, 101, 0.3);
      }

      .btn-sm {
        padding: 8px 16px;
        font-size: 13px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .stat-value {
        font-size: 36px;
        font-weight: 700;
        color: #667eea;
        margin-bottom: 8px;
      }

      .stat-label {
        font-size: 14px;
        color: #868e96;
      }

      .site-section {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #f1f3f5;
      }

      .site-name {
        font-size: 20px;
        font-weight: 600;
        color: #2c3e50;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .site-badge {
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
      }

      .rule-list {
        display: grid;
        gap: 12px;
      }

      .rule-item {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 16px;
        transition: all 0.2s;
      }

      .rule-item:hover {
        border-color: #667eea;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
      }

      .rule-item.disabled {
        opacity: 0.5;
      }

      .rule-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
        gap: 15px;
      }

      .rule-info {
        flex: 1;
        min-width: 0;
      }

      .rule-type {
        display: inline-block;
        background: #667eea;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .rule-type.xpath {
        background: #48bb78;
      }

      .rule-mode {
        display: inline-block;
        background: #f56565;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
        margin-left: 5px;
      }

      .rule-mode.hide {
        background: #48bb78;
      }

      .rule-selector {
        font-family: "Consolas", "Monaco", monospace;
        font-size: 13px;
        color: #495057;
        word-break: break-all;
        background: white;
        padding: 8px 12px;
        border-radius: 4px;
        margin-bottom: 8px;
      }

      .rule-desc {
        font-size: 12px;
        color: #868e96;
      }

      .rule-meta {
        font-size: 11px;
        color: #adb5bd;
        margin-top: 4px;
      }

      .rule-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .rule-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
        white-space: nowrap;
      }

      .rule-btn-toggle {
        background: #48bb78;
        color: white;
      }

      .rule-btn-toggle.disabled {
        background: #868e96;
      }

      .rule-btn-edit {
        background: #667eea;
        color: white;
      }

      .rule-btn-delete {
        background: #f56565;
        color: white;
      }

      .rule-btn:hover {
        transform: scale(1.05);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #868e96;
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: 16px;
      }

      .empty-state-text {
        font-size: 18px;
        font-weight: 500;
      }

      /* Toast通知 */
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: white;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        display: none;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        animation: slideInRight 0.3s ease-out;
      }

      .toast.show {
        display: flex;
      }

      .toast.success {
        border-left: 4px solid #48bb78;
      }

      .toast.error {
        border-left: 4px solid #f56565;
      }

      .toast.info {
        border-left: 4px solid #667eea;
      }

      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes slideOutRight {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }

      /* 编辑模态框 */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 30px;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #f1f3f5;
      }

      .modal-title {
        font-size: 22px;
        font-weight: 600;
        color: #2c3e50;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 28px;
        color: #868e96;
        cursor: pointer;
        padding: 0;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all 0.2s;
      }

      .modal-close:hover {
        background: #f1f3f5;
        color: #495057;
      }

      .modal-body {
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #495057;
        margin-bottom: 8px;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 14px;
        font-family: "Consolas", "Monaco", monospace;
        transition: border-color 0.2s;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-select {
        width: 100%;
        padding: 12px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 14px;
        background: white;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .form-select:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .form-checkbox input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }

      .form-checkbox label {
        font-size: 14px;
        color: #495057;
        cursor: pointer;
      }

      .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        padding-top: 16px;
        border-top: 2px solid #f1f3f5;
      }

      .modal-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
      }

      .modal-btn-cancel {
        background: #e9ecef;
        color: #495057;
      }

      .modal-btn-cancel:hover {
        background: #dee2e6;
      }

      .modal-btn-save {
        background: #667eea;
        color: white;
      }

      .modal-btn-save:hover {
        background: #5568d3;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .helper-text {
        font-size: 12px;
        color: #868e96;
        margin-top: 6px;
        font-style: italic;
      }

      .validation-message {
        font-size: 12px;
        margin-top: 6px;
        padding: 8px 12px;
        border-radius: 4px;
        display: none;
      }

      .validation-message.show {
        display: block;
      }

      .validation-message.success {
        background: #d4edda;
        color: #155724;
      }

      .validation-message.error {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🗑️ 规则管理中心</h1>
        <div class="subtitle">查看和管理所有网站的隐藏规则</div>
      </div>

      <!-- 统计卡片 -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="totalSites">0</div>
          <div class="stat-label">已配置网站</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalRules">0</div>
          <div class="stat-label">总规则数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="activeRules">0</div>
          <div class="stat-label">已启用规则</div>
        </div>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 搜索网站或规则..."
          />
        </div>
        <button class="btn btn-primary" id="exportRules">📤 导出规则</button>
        <button class="btn btn-primary" id="importRules">📥 导入规则</button>
        <button class="btn btn-danger" id="clearAll">🗑️ 清空所有</button>
      </div>

      <!-- 规则列表 -->
      <div id="rulesList"></div>
    </div>

    <!-- Toast通知 -->
    <div id="toast" class="toast">
      <span id="toastIcon"></span>
      <span id="toastMessage"></span>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">✏️ 编辑规则</h2>
          <button class="modal-close" id="modalCloseBtn">×</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">选择器类型</label>
            <select id="editType" class="form-select">
              <option value="css">CSS 选择器</option>
              <option value="xpath">XPath</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">选择器</label>
            <textarea
              id="editSelector"
              class="form-textarea"
              rows="4"
            ></textarea>
            <div class="helper-text" id="editSelectorHelper">
              CSS 示例: #ad-banner, .popup-overlay<br />
              XPath 示例: //*[@id="aswift_3_host"], //div[@class="ad"]
            </div>
            <div id="editValidationMessage" class="validation-message"></div>
          </div>

          <div class="form-group">
            <label class="form-label">规则描述</label>
            <input
              type="text"
              id="editDescription"
              class="form-input"
              placeholder="例如：移除顶部广告"
            />
          </div>

          <div class="form-group">
            <label class="form-label">操作模式</label>
            <div class="form-checkbox">
              <input type="checkbox" id="editRemoveMode" />
              <label for="editRemoveMode"
                >删除模式（直接从 DOM 移除，而不是隐藏）</label
              >
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">状态</label>
            <div class="form-checkbox">
              <input type="checkbox" id="editEnabled" checked />
              <label for="editEnabled">启用此规则</label>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">
            取消
          </button>
          <button class="modal-btn modal-btn-save" id="modalSaveBtn">
            保存修改
          </button>
        </div>
      </div>
    </div>

    <!-- 导入文件输入 -->
    <input type="file" id="fileInput" accept=".json" style="display: none" />

    <script src="rules.js"></script>
  </body>
</html>
